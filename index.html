<!DOCTYPE html>
<html lang="en-GB">
<head>

  <title>KevinpSB Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 48px 32px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 2.4rem;
      color: #1f2937;
    }

    p {
      font-size: 1.1rem;
      color: #4b5563;
    }

    .footer {
      margin-top: 32px;
      font-size: 0.9rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Welcome to KevinpSB</h1>
      <p>This is a simple landing page for my website.</p>
      <p>More content will be added here soon.</p>
    </section>

    <footer class="footer">
      &copy; 2026 KevinpSB
    </footer>
  </main>

</html>

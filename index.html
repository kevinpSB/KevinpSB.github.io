<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KevinpSB Website</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 48px 32px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 2.4rem;
      color: #1f2937;
    }

    p {
      font-size: 1.1rem;
      color: #4b5563;
    }

    .link-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .feature-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 13px 18px;
      border-radius: 999px;
      background: #0f766e;
      color: white;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 22px rgba(15, 118, 110, 0.22);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .feature-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 26px rgba(15, 118, 110, 0.28);
    }

    .feature-link.secondary {
      background: #7c3aed;
      box-shadow: 0 10px 22px rgba(124, 58, 237, 0.2);
    }

    .feature-link.secondary:hover {
      box-shadow: 0 14px 26px rgba(124, 58, 237, 0.27);
    }

    .feature-link.tertiary {
      background: #1d4ed8;
      box-shadow: 0 10px 22px rgba(29, 78, 216, 0.2);
    }

    .feature-link.tertiary:hover {
      box-shadow: 0 14px 26px rgba(29, 78, 216, 0.27);
    }

    .footer {
      margin-top: 32px;
      font-size: 0.9rem;
      color: #6b7280;
    }

    @media (max-width: 640px) {
      .link-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Welcome to KevinpSB</h1>
      <p>This is a simple landing page for my website.</p>
      <p>More content will be added here soon.</p>
      <div class="link-grid">
        <a class="feature-link" href="ai-history.html">View the OpenAI history infographic</a>
        <a class="feature-link secondary" href="retrievers.html">Meet the retriever dog breeds</a>
        <a class="feature-link tertiary" href="worcester-birmingham-canal.html">Explore the Worcester &amp; Birmingham Canal</a>
      </div>
    </section>

    <footer class="footer">
      &copy; 2026 KevinpSB
    </footer>
  </main>
</body>
</html>
